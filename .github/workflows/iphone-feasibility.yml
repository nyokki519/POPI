name: iPhone ReplayKit feasibility
on:
  push:
    paths:
      - 'iphone-feasibility/**'
      - 'gravity-iphone/**'
      - 'gravity-reader/Sources/CommentCore.swift'
      - '.github/workflows/iphone-feasibility.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iphone-validation-and-package
  cancel-in-progress: true
jobs:
  ios-extension-build:
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Swift comment core tests
        run: bash gravity-iphone/scripts/test-core.sh
      - name: Native Vision bubble OCR and cache tests
        run: bash gravity-iphone/scripts/test-native.sh
      - name: iOS Broadcast Upload Extension API validation
        shell: bash
        run: |
          set -euo pipefail
          SDK_PATH="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          xcrun swiftc --version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun swiftc -swift-version 5 -sdk "$SDK_PATH" -target arm64-apple-ios16.0-simulator \
            -application-extension -typecheck iphone-feasibility/BroadcastProbe.swift
          xcrun swiftc -swift-version 5 -sdk "$SDK_PATH" -target arm64-apple-ios16.0-simulator \
            -application-extension -emit-library iphone-feasibility/BroadcastProbe.swift \
            -o "$RUNNER_TEMP/BroadcastProbe.dylib"
          echo 'API typecheck and simulator library link passed; NOT a real iPhone/GRAVITY playback test.'
      - name: Build iPhone app and ReplayKit upload extension
        shell: bash
        run: |
          set -euo pipefail
          cd gravity-iphone
          python3 scripts/generate-project.py
          xcodebuild -project GravityReader.xcodeproj -scheme GravityReader -sdk iphonesimulator -configuration Debug -derivedDataPath "$RUNNER_TEMP/GravityBuild" CODE_SIGNING_ALLOWED=NO build
          APP="$RUNNER_TEMP/GravityBuild/Build/Products/Debug-iphonesimulator/GravityReader.app"
          python3 scripts/verify-bundle.py "$APP"
          test -f "$APP/PlugIns/Upload.appex/Upload"
          plutil -lint "$APP/Info.plist" "$APP/PlugIns/Upload.appex/Info.plist"
      - name: Native floral home simulator smoke test
        if: contains(github.event.head_commit.message, '[ui smoke]')
        shell: bash
        run: python3 gravity-iphone/scripts/smoke-ui.py "$RUNNER_TEMP/GravityBuild/Build/Products/Debug-iphonesimulator/GravityReader.app"
      - name: Build unsigned iPhone device binaries
        shell: bash
        run: |
          set -euo pipefail
          cd gravity-iphone
          xcodebuild -project GravityReader.xcodeproj -scheme GravityReader -sdk iphoneos -destination 'generic/platform=iOS' -configuration Release -derivedDataPath "$RUNNER_TEMP/GravityDevice" CODE_SIGNING_ALLOWED=NO build
          APP="$RUNNER_TEMP/GravityDevice/Build/Products/Release-iphoneos/GravityReader.app"
          python3 scripts/verify-bundle.py "$APP"
          test -f "$APP/PlugIns/Upload.appex/Upload"
          xcrun lipo -archs "$APP/GravityReader"
          xcrun lipo -archs "$APP/PlugIns/Upload.appex/Upload"
          python3 scripts/package-ipa.py "$APP" "$RUNNER_TEMP/Okama-Sukkiri-iPhone-unsigned.ipa"
      - name: Publish downloadable unsigned IPA
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          IPA_PATH: ${{ runner.temp }}/Okama-Sukkiri-iPhone-unsigned.ipa
        run: |
          python3 - <<'PY'
          import os,json,base64,urllib.request,urllib.error
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']
          url=f'https://api.github.com/repos/{repo}/contents/gravity-iphone/dist/Okama-Sukkiri-iPhone-unsigned.ipa'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          try:
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers)) as r:previous=json.load(r)['sha']
          except urllib.error.HTTPError as e:
              if e.code!=404:raise
              previous=None
          payload={'message':'Publish unsigned iPhone IPA for Windows re-signing [skip ci]','content':base64.b64encode(Path(os.environ['IPA_PATH']).read_bytes()).decode(),'branch':'main'}
          if previous:payload['sha']=previous
          req=urllib.request.Request(url,data=json.dumps(payload).encode(),headers={**headers,'Content-Type':'application/json'},method='PUT')
          with urllib.request.urlopen(req) as r:result=json.load(r)
          print('Published unsigned IPA:',result['content']['html_url'])
          print('Built source:',os.environ['GITHUB_SHA'])
          PY

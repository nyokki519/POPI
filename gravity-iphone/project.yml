name: GravityReader
options:
  bundleIdPrefix: jp.nyokki519
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
targets:
  GravityReader:
    type: application
    platform: iOS
    sources: [Sources/App]
    info:
      path: App-Info.plist
      properties:
        CFBundleDisplayName: Gravity Reader
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.nyokki519.GravityReader
    dependencies:
      - target: Setup
      - target: Upload
  Setup:
    type: app-extension
    platform: iOS
    sources: [Sources/Setup, Sources/Shared/Configuration.swift]
    info:
      path: Setup-Info.plist
      properties:
        CFBundleDisplayName: Gravity Reader
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-setupui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SetupViewController
          NSExtensionAttributes:
            RPBroadcastExtension: jp.nyokki519.GravityReader.Upload
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.nyokki519.GravityReader.Setup
        APPLICATION_EXTENSION_API_ONLY: YES
  Upload:
    type: app-extension
    platform: iOS
    sources: [Sources/Upload, Sources/Shared]
    info:
      path: Upload-Info.plist
      properties:
        CFBundleDisplayName: Gravity Reader PRIVATE
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          NSExtensionAttributes:
            RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.nyokki519.GravityReader.Upload
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  GravityReader:
    build:
      targets:
        GravityReader: all
